name: Validate static website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate HTML, metadata, structured data, and local links
        run: python scripts/validate_site.py
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check live-stream.js
